[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "C4",   # simplify comprehensions
    "SIM",  # simplify logic
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"