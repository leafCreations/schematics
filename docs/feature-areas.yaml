    tab: Render Tab
    paths:
      - ui/widgets/render_panel.py
    wiring:
      - ui/main_window.py
      - ui/widgets/preview_panel.py
    tests:
      - tests/test_render_panel.py
    related:
      - Render Panel
      - Render Preview
      - Render Pipeline
    docs:
