# Feature area registry — user-facing labels → repo paths.
# Used by kanban cards (## Feature Areas) and agents during pre-implementation review.
# See .cursor/skills/kanban-markdown/SKILL.md
#
# Schema per area:
#   summary: one-line description
#   tab: optional parent tab (Structure Tab | Site Tab | Render Tab)
#   paths: primary implementation files
#   wiring: orchestration / integration (often main_window.py)
#   handlers: optional stable methods/symbols for kanban ## Label Methods seeding
#   tests: pytest files
#   related: other feature area labels to consider
#   docs: optional user/developer docs
#   lesson_signatures: optional curated promotion Signatures (≤8; grep targets)
#   lesson_docs: optional lesson doc paths (≤5; under docs/)
#   agents_skill: optional primary skill stem (no path prefix) — gate loads
#     .cursor/skills/{stem}/SKILL.md (e.g. ui-change, agent-triage, kanban-markdown)
#   agents_rules: optional list of rule filenames under .cursor/rules/ with optional
#     #signature anchor for Signature-scoped rules (e.g. ui-panels.mdc,
#     testing.mdc#orbit-animated-texture-strip)
#   lesson_routing_row: optional string | null — substring of the **Signal / Feature Area**
#     first column in agent-triage/reference.md § Lessons by area; use null when
#     lessons-index.yaml area block is sufficient (index-only routing)
#
# Governance area schema (epic GovernanceAreaSchema gs0–gs3):
#   Source of truth for agent skill/rule routing is this yaml — not AGENTS.md tables.
#   All governance keys are optional; absent keys skip parity checks until gs1 seeds them.
#   gs1 seeded: Render Preview, Agent Workflow, Properties Panel, Feature Area Registry,
#   Palette Registry (agents_skill / agents_rules / lesson_routing_row). AGENTS table
#   sync deferred until post–gs3 (Signature: governance-area-schema-defer-agents-table).
#
# Example (gs1 seeded — see Render Preview area):
#   agents_skill: ui-change
#   agents_rules: [ui-panels.mdc, testing.mdc#orbit-animated-texture-strip, …]
#   lesson_routing_row: Render Preview

