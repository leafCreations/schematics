  Add Layer Dialog:
    summary: Add layer with Y index and group
    paths:
      - ui/widgets/add_layer_dialog.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Edit Group Dialog:
    summary: Rename layer group
    paths:
      - ui/widgets/edit_group_dialog.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  New Structure Dialog:
    summary: Create new structure package with Minecraft version
    paths:
      - ui/widgets/new_structure_dialog.py
      - helpers/minecraft_versions.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Catalog Generation:
    summary: Generated block catalog from Minecraft assets with optional introduced_in metadata
    paths:
      - scripts/generate_catalog.py
      - helpers/block_catalog.py
      - registries/generated/catalog.json
    docs:
