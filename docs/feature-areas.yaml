  Site Nudge Controls:
    summary: Arrow nudge for structure placement on site grid
    tab: Site Tab
    paths:
      - ui/widgets/site_nudge_controls.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Render Panel:
    summary: Export Render split button, Generate World, output folder hint
    tab: Render Tab
    paths:
      - ui/widgets/render_panel.py
    wiring:
      - ui/main_window.py
      - ui/widgets/preview_panel.py
    tests:
      - tests/test_render_panel.py
