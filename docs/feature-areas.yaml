  Feature Area Registry:
    summary: Kanban feature labels mapped to repo paths
    paths:
      - docs/feature-areas.yaml
    wiring:
      - scripts/resolve_feature_areas.py
    docs:
      - .cursor/skills/kanban-markdown/SKILL.md
