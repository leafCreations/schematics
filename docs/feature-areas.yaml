      - renderers/preview_materials.py
      - renderers/structure_facades.py
      - renderers/site_facades.py
      - renderers/path_view.py
      - renderers/materials.py
      - renderers/layer_panel.py
    wiring:
      - ui/main_window.py
      - ui/render_worker.py
      - render_main.py
    tests:
      - tests/test_preview_panel.py
      - tests/test_render_preview.py
      - tests/test_structure_facades.py
      - tests/test_preview_site_facades.py
      - tests/test_preview_site_topdown.py
      - tests/test_preview_materials.py
      - tests/test_landscape_utils.py
    related:
      - Render Tab
      - Render Selection
      - Render Pipeline
    docs:
      - docs/ui.md

  Render Selection:
    summary: Render-type dropdown on preview panel (Top Down, Structure Facades, Site Facades, Site Top Down, Materials List)
    tab: Render Tab
    paths:
      - ui/widgets/preview_panel.py
      - renderers/registry.py
    wiring:
      - ui/main_window.py
