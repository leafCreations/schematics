      - Block Picker
    docs:
      - docs/ui.md
      - docs/editor-properties.md

  Materials Panel:
    summary: Live materials inventory for current layer or all layers
    tab: Structure Tab
    paths:
      - ui/widgets/materials_panel.py
      - ui/editor_materials.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_materials.py
    docs:
      - docs/ui.md

  Compass Panel:
    summary: North-up orientation rose
    paths:
      - ui/widgets/compass_panel.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Site Grid:
    summary: Site footprint preview with structure overlay
    tab: Site Tab
    paths:
      - ui/widgets/site_grid.py
      - ui/site_cells.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_site_cells.py
    docs:
      - docs/ui.md

  Site Settings Panel:
    summary: Site width/depth, placement anchors, offsets
    tab: Site Tab
    paths:
      - ui/widgets/site_settings_panel.py
      - helpers/site_ground.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md
      - docs/editor-properties.md

  Path Brush Panel:
    summary: Site path painting controls
    tab: Site Tab
    paths:
      - ui/widgets/site_path_panel.py
      - helpers/path_geometry.py
      - helpers/path_strip.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_path_geometry.py
      - tests/test_path_strip.py
    docs:
