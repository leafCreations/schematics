# Feature area registry — user-facing labels → repo paths.
# Used by kanban cards (## Feature Areas) and agents during pre-implementation review.
# See .cursor/skills/kanban-markdown/SKILL.md
#
# Schema per area:
#   summary: one-line description
#   tab: optional parent tab (Structure Tab | Site Tab | Render Tab)
#   paths: primary implementation files
#   wiring: orchestration / integration (often main_window.py)
#   tests: pytest files
#   related: other feature area labels to consider
#   docs: optional user/developer docs

areas:
  File Menu:
    summary: Open, save, reload, new structure, exit
    paths:
      - ui/main_window.py
    docs:
      - docs/ui.md

  View Menu:
    summary: Panel visibility, grid axis labels, block tooltips
    paths:
      - ui/main_window.py
      - config/editor_settings.yaml
      - ui/app_settings.py
    docs:
      - docs/ui.md

  Structure Menu:
    summary: Structure tab menus including render shortcuts
    paths:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Structure Tab:
    summary: Layer editing tab shell (palettes, grid, inspector columns)
    tab: Structure Tab
    paths:
      - ui/main_window.py
    related:
      - Palettes Panel
      - Structure Grid
      - Groups Panel
      - Layers Panel
    docs:
      - docs/ui.md

  Site Tab:
    summary: Site footprint preview and placement tab shell
    tab: Site Tab
    paths:
      - ui/main_window.py
    related:
      - Site Grid
      - Site Settings Panel
      - Path Brush Panel
    docs:
      - docs/ui.md

  Render Tab:
    summary: Viewer tab shell (render panel + preview panel)
    tab: Render Tab
    paths:
      - ui/main_window.py
    related:
      - Render Panel
      - Render Preview
    docs:
      - docs/ui.md

  Palettes Panel:
    summary: Block category search and palette picker (left column)
    tab: Structure Tab
    paths:
      - ui/widgets/palette_panel.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_palette_panel.py
    related:
      - Palette Registry
      - Block Picker
    docs:
      - docs/ui.md
      - docs/registry.md

  Groups Panel:
    summary: Layer group filter, CRUD, visibility, reorder
    tab: Structure Tab
    paths:
      - ui/widgets/groups_panel.py
      - helpers/layer_groups.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_layer_groups.py
    related:
      - Layers Panel
    docs:
      - docs/ui.md

  Layers Panel:
    summary: Layer list, reorder, visibility, CRUD
    tab: Structure Tab
    paths:
      - ui/widgets/layer_list_panel.py
      - ui/widgets/list_panel_base.py
    wiring:
      - ui/main_window.py
    related:
      - Groups Panel
      - Add Layer Dialog
    docs:
      - docs/ui.md

  Structure Settings Panel:
    summary: Structure identity, stage, output folder, grid size, Minecraft version
    tab: Structure Tab
    paths:
      - ui/widgets/structure_settings_panel.py
      - ui/widgets/structure_properties_panel.py
      - ui/widgets/structure_size_panel.py
      - helpers/minecraft_versions.py
      - helpers/structure_metadata.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md
      - docs/editor-properties.md

  Structure Grid:
    summary: Layer paint/erase/selector/move grid
    tab: Structure Tab
    paths:
      - ui/widgets/grid.py
      - helpers/grid_brush.py
      - helpers/cells.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_cells.py
      - tests/test_grid_scrollbars.py
      - tests/test_layer_grid_paint.py
    related:
      - Layer Toolbar
      - Paint Brush Panel
    docs:
      - docs/ui.md

  Layer Toolbar:
    summary: Grid header tools (selector, move, paint, eraser, rotate, save)
    tab: Structure Tab
    paths:
      - ui/widgets/layer_tools_panel.py
    wiring:
      - ui/main_window.py
    related:
      - Selector Panel
      - Paint Brush Panel
      - Eraser Panel
    docs:
      - docs/ui.md

  Paint Brush Panel:
    summary: Paint mode hints and brush options (right column)
    tab: Structure Tab
    paths:
      - ui/widgets/layer_paint_brush_panel.py
    wiring:
      - ui/main_window.py
    related:
      - Properties Panel
      - Structure Grid
    docs:
      - docs/ui.md

  Selector Panel:
    summary: Rectangle selection mode hints
    tab: Structure Tab
    paths:
      - ui/widgets/layer_selector_panel.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Eraser Panel:
    summary: Eraser size and mode hints
    tab: Structure Tab
    paths:
      - ui/widgets/layer_eraser_panel.py
    wiring:
      - ui/main_window.py
    docs:
      - docs/ui.md

  Properties Panel:
    summary: Selected block / grid cell inspector, brush preview
    tab: Structure Tab
    paths:
      - ui/widgets/properties_panel.py
      - helpers/brush_preview.py
    wiring:
      - ui/main_window.py
    tests:
      - tests/test_properties_panel.py
      - tests/test_brush_preview.py
