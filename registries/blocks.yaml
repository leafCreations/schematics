DIRT:
  behavior: solid
  minecraft:
    block: minecraft:dirt
DIRT_PATH:
  behavior: solid
  minecraft:
    block: minecraft:dirt_path
  render:
    textures:
      top: dirt_path_top.png

GRASS:
  behavior: solid
  minecraft:
    block: minecraft:grass_block
  render:
    textures:
      top: grass_block_top.png
    background_color: [95, 160, 75]
GRAVEL:
  behavior: solid
  minecraft:
    block: minecraft:gravel

COBBLESTONE:
  behavior: solid
  defaults:
    variant: normal
  minecraft:
    variants:
      normal:
        block: minecraft:cobblestone
      mossy:
        block: minecraft:mossy_cobblestone

LOG:
  behavior: log
  material_default: oak
  defaults:
    orientation: vertical
  minecraft:
    block: minecraft:{material}_log
    blockstates:
      vertical: y
      east_west: x
      north_south: z
  render:
    textures:
      top: "{material}_log_top.png"
      side: "{material}_log.png"
PLANKS:
  behavior: solid
  material_default: oak
  minecraft:
    block: "minecraft:{material}_planks"
SLAB:
  behavior: slab
  material_default: oak
  defaults:
    type: bottom
  minecraft:
    block: "minecraft:{material}_slab"
    blockstates:
      type: "{type}"
  render:
    textures:
      top: "{material}_planks.png"
      side: "{material}_planks.png"
    inventory_image: /custom/oak_slab.png

FURNACE:
  behavior: facing_block
  defaults:
    direction: north
  minecraft:
    block: minecraft:furnace
    blockstates:
      facing: "{direction}"
  render:
    textures:
      top: furnace_front.png
    inventory_image: furnace_front.png
  visibility:
    interior: false

CRAFTING_TABLE:
  behavior: solid
  minecraft:
    block: minecraft:crafting_table
  render:
    textures:
      top: crafting_table_top.png
  visibility:
    interior: false

TORCH:
  behavior: torch
  defaults:
    variant: normal
    direction: north
  minecraft:
    variants:
      normal:
        block: minecraft:torch
      soul:
        block: minecraft:soul_torch
      wall:
        block: minecraft:wall_torch
        blockstates:
          facing: "{direction}"
  render:
    inventory_image: torch.png

DOOR:
  behavior: door
  material_default: oak
  defaults:
    direction: north
    half: lower
    hinge: left
    open: false
  minecraft:
    block: "minecraft:{material}_door"
    blockstates:
      facing: "{direction}"
      half: "{half}"
      hinge: "{hinge}"
      open: "{open}"
  render:
    textures:
      upper: "{material}_door_top.png"
      lower: "{material}_door_bottom.png"
    inventory_image: /custom/oak_door.png

FENCE:
  behavior: fence
  material_default: oak
  defaults:
    north: false
    south: false
    east: false
    west: false
  minecraft:
    block: "minecraft:{material}_fence"
    blockstates:
      north: "{north}"
      south: "{south}"
      east: "{east}"
      west: "{west}"
  render:
    textures:
      post: "/custom/{material}_fence_side.png"
      end: "/custom/{material}_fence_side.png"
      straight: "/custom/{material}_fence_side.png"
      corner: "/custom/{material}_fence_side.png"
      tee: "/custom/{material}_fence_side.png"
      cross: "/custom/{material}_fence_side.png"
    inventory_image: /custom/oak_fence_side.png

STAIRS:
  behavior: stairs
  material_default: oak
  defaults:
    direction: north
    half: bottom
    shape: straight
  minecraft:
    block: "minecraft:{material}_stairs"
    blockstates:
      facing: "{direction}"
      half: "{half}"
      shape: "{shape}"
  render:
    textures:
      straight: "/custom/{material}_stairs_top.png"
      outer_left: "/custom/{material}_stairs_outer_left.png"
      outer_right: "/custom/{material}_stairs_outer_right.png"
      inner_left: "/custom/{material}_stairs_inner_left.png"
      inner_right: "/custom/{material}_stairs_inner_right.png"
    inventory_image: /custom/stairs.png

BED:
  behavior: bed
  defaults:
    direction: north
    part: head
  minecraft:
    block: minecraft:red_bed
    blockstates:
      facing: "{direction}"
      part: "{part}"
      occupied: false
  render:
    textures:
      head: /custom/red_bed_top.png
      foot: /custom/red_bed_bottom.png
    inventory_image: /custom/red_bed.png
  visibility:
    interior: false

CHEST:
  behavior: chest
  material_default: oak
  defaults:
    direction: north
    type: single
  minecraft:
    block: minecraft:chest
    blockstates:
      facing: "{direction}"
      type: "{type}"
  render:
    textures:
      single: /custom/chest.png
      left: /custom/double_chest_left.png
      right: /custom/double_chest_right.png
    inventory_image: /custom/chest.png
  visibility:
    interior: false
