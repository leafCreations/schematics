FURNACE:
  behavior: facing_block
  ui:
    label: Furnace
    palette: functional
    requires_material: false
    requires_direction: true
    requires_variant: false
  defaults:
    direction: north
    lit: "false"
  minecraft:
    block: minecraft:furnace
    blockstates:
      facing: '{direction}'
      lit: '{lit}'
  render:
    top: furnace_front.png
    side: furnace_side.png
    inventory_image: furnace_front.png
  visibility:
    interior: false
SMOKER:
  behavior: facing_block
  ui:
    label: Smoker
    palette: functional
    requires_material: false
    requires_direction: true
    requires_variant: false
  defaults:
    direction: north
    lit: "false"
  minecraft:
    block: minecraft:smoker
    blockstates:
      facing: '{direction}'
      lit: '{lit}'
  render:
    top: smoker_front.png
    side: smoker_side.png
    inventory_image: smoker_front.png
  visibility:
    interior: false
BLAST_FURNACE:
  behavior: facing_block
  ui:
    label: Blast Furnace
    palette: functional
    requires_material: false
    requires_direction: true
    requires_variant: false
  defaults:
    direction: north
    lit: "false"
  minecraft:
    block: minecraft:blast_furnace
    blockstates:
      facing: '{direction}'
      lit: '{lit}'
  render:
    top: blast_furnace_front.png
    side: blast_furnace_side.png
    inventory_image: blast_furnace_front.png
  visibility:
    interior: false
CRAFTING_TABLE:
  behavior: solid
  ui:
    label: Crafting Table
    palette: functional
    requires_material: false
    requires_direction: false
    requires_variant: false
  minecraft:
    block: minecraft:crafting_table
  render:
    top: crafting_table_top.png
  visibility:
    interior: false
DOOR:
  behavior: door
  material_default: oak
  ui:
    label: '{material} Door'
    palette: functional
    requires_material: true
    requires_direction: true
    requires_variant: false
    variants:
    - lower
    - upper
  defaults:
    direction: north
    half: lower
    hinge: left
    open: false
  minecraft:
    block: minecraft:{material}_door
    blockstates:
      facing: '{direction}'
      half: '{half}'
      hinge: '{hinge}'
      open: '{open}'
  render:
    textures:
      upper: '{material}_door_top.png'
      lower: '{material}_door_bottom.png'
BED:
  behavior: bed
  color_default: red
  ui:
    label: '{color} Bed'
    palette: functional
    requires_material: true
    requires_direction: true
    requires_variant: false
    variants:
    - head
    - foot
  defaults:
    direction: north
    part: head
  minecraft:
    block: minecraft:bed
    blockstates:
      color: '{color}'
      facing: '{direction}'
      part: '{part}'
      occupied: false
  render:
    textures:
      head: '{color}_bed_head.png'
      foot: '{color}_bed_foot.png'
  visibility:
    interior: false
CHEST:
  behavior: chest
  material_default: oak
  ui:
    label: Chest
    palette: functional
    requires_material: false
    requires_direction: true
    requires_variant: false
    variants:
    - left
    - right
  defaults:
    direction: north
    variant: single
  minecraft:
    variants:
      single:
        block: minecraft:chest
        blockstates:
          facing: '{direction}'
      left:
        block: minecraft:chest
        blockstates:
          type: left
          facing: '{direction}'
      right:
        block: minecraft:chest
        blockstates:
          type: right
          facing: '{direction}'
  render:
    textures:
      single: chest_single.png
      left: chest_left.png
      right: chest_right.png
    inventory_image: chest_single.png
  visibility:
    interior: false
