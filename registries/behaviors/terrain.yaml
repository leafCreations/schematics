    - 160
    - 75
GRAVEL:
  behavior: solid
  ui:
    label: Gravel
    palette: terrain
    requires_material: false
    requires_direction: false
    requires_variant: false
  minecraft:
    block: minecraft:gravel
COBBLESTONE:
  behavior: solid
  ui:
    label: Cobblestone
    palette: terrain
    requires_material: false
    requires_direction: false
