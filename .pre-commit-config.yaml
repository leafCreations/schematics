repos:
  - repo: local
    hooks:
      - id: ruff-fix-format
        name: ruff (fix + format, re-stage)
        entry: scripts/pre-commit-ruff.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: validate-palettes
        name: validate palette/registry integrity
        entry: scripts/pre-commit-validate-palettes.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (targeted by staged paths)
        entry: scripts/pre-commit-pytest.sh
        language: script
        pass_filenames: false
        always_run: true
